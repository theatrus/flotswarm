name: release

# Build the agent packages (.deb/.rpm) and the distributor Lambda zip, and
# publish them to a GitHub Release. Tag push `v*` cuts a versioned release;
# workflow_dispatch just builds + uploads artifacts (no release) for testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0)"
        required: true
        default: "0.0.0"

permissions:
  contents: write # create releases / upload assets

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  agent-packages:
    needs: [check, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build deb + rpm
        run: make deb rpm VERSION=${{ needs.version.outputs.version }} ARCH=amd64
      - uses: actions/upload-artifact@v4
        with:
          name: agent-packages
          path: dist/*

  lambda:
    needs: [check, version]
    runs-on: ubuntu-24.04-arm # native arm64 — matches the deployed Lambda arch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-lambda + zig (from PyPI, no flaky zig mirrors)
        run: |
          python3 -m pip install --user --break-system-packages cargo-lambda ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build Lambda zip
        run: make lambda
      - uses: actions/upload-artifact@v4
        with:
          name: distributor-lambda
          path: target/lambda/bootstrap/bootstrap.zip

  release:
    needs: [agent-packages, lambda]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename the Lambda zip to include the version
        run: |
          mkdir -p out
          cp artifacts/agent-packages/* out/
          cp artifacts/distributor-lambda/bootstrap.zip out/flotswarm-distributor-${GITHUB_REF_NAME}.zip
          ls -l out/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*
