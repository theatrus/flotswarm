<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">flotswarm logo</title>
  <desc id="desc">A central ingress signal fans out to host nodes above layered wave lines, paired with the flotswarm wordmark.</desc>
  <defs>
    <radialGradient id="panel" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#142436"/>
      <stop offset="1" stop-color="#08111b"/>
    </radialGradient>
    <linearGradient id="teal" x1="70" y1="178" x2="360" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1aa7cf"/>
      <stop offset=".48" stop-color="#61ead4"/>
      <stop offset="1" stop-color="#1d7fb8"/>
    </linearGradient>
    <linearGradient id="amber" x1="154" y1="50" x2="248" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd56e"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="928" height="228" rx="36" fill="url(#panel)"/>
  <rect x="16" y="16" width="928" height="228" rx="36" fill="none" stroke="#25384a" stroke-width="2"/>

  <g transform="translate(56 32)">
    <path d="M60 166c49-36 90-36 139 0s91 36 139 0" fill="none" stroke="#123d5c" stroke-width="30" stroke-linecap="round" opacity=".76"/>
    <path d="M48 158c51-31 101-31 151 0s99 31 151 0" fill="none" stroke="url(#teal)" stroke-width="17" stroke-linecap="round"/>
    <path d="M86 197c38-22 75-22 113 0s75 22 113 0" fill="none" stroke="#1f6f9f" stroke-width="13" stroke-linecap="round" opacity=".82"/>

    <g fill="none" stroke="#61ead4" stroke-width="7" stroke-linecap="round">
      <path d="M199 78C151 95 113 117 82 143"/>
      <path d="M199 78c-32 31-48 58-48 82"/>
      <path d="M199 78v94"/>
      <path d="M199 78c32 31 48 58 48 82"/>
      <path d="M199 78c48 17 86 39 117 65"/>
    </g>

    <g filter="url(#glow)">
      <circle cx="199" cy="78" r="23" fill="url(#amber)"/>
      <circle cx="199" cy="78" r="42" fill="none" stroke="#f5b84b" stroke-width="7" opacity=".82"/>
      <circle cx="199" cy="78" r="67" fill="none" stroke="#f5b84b" stroke-width="5" opacity=".48"/>
      <circle cx="82" cy="143" r="22" fill="#0b1823" stroke="#61ead4" stroke-width="8"/>
      <circle cx="151" cy="160" r="22" fill="#0b1823" stroke="#61ead4" stroke-width="8"/>
      <circle cx="199" cy="172" r="22" fill="#0b1823" stroke="#61ead4" stroke-width="8"/>
      <circle cx="247" cy="160" r="22" fill="#0b1823" stroke="#61ead4" stroke-width="8"/>
      <circle cx="316" cy="143" r="22" fill="#0b1823" stroke="#61ead4" stroke-width="8"/>
    </g>

    <g fill="#9ff8eb">
      <rect x="74" y="135" width="16" height="16" rx="4"/>
      <rect x="143" y="152" width="16" height="16" rx="4"/>
      <rect x="191" y="164" width="16" height="16" rx="4"/>
      <rect x="239" y="152" width="16" height="16" rx="4"/>
      <rect x="308" y="135" width="16" height="16" rx="4"/>
    </g>
  </g>

  <g transform="translate(436 82)">
    <text x="0" y="0"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="64" font-weight="850" letter-spacing=".5" fill="#edf7ff">flot</text>
    <text x="127" y="0"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="64" font-weight="850" letter-spacing=".5" fill="#61ead4">swarm</text>
    <text x="2" y="45"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="750" letter-spacing="3.2" fill="#93a9bc">WEBHOOKS LAND ONCE. AGENTS PULL.</text>

    <g transform="translate(4 82)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 18h82l24-18h84l24 18h118" stroke="#61ead4" stroke-width="7"/>
      <path d="M0 52h124l22-18h86l22 18h78" stroke="#f5b84b" stroke-width="7" opacity=".84"/>
      <circle cx="82" cy="18" r="7" fill="#61ead4" stroke="none"/>
      <circle cx="214" cy="18" r="7" fill="#61ead4" stroke="none"/>
      <circle cx="124" cy="52" r="7" fill="#f5b84b" stroke="none"/>
      <circle cx="254" cy="52" r="7" fill="#f5b84b" stroke="none"/>
    </g>
  </g>
</svg>
